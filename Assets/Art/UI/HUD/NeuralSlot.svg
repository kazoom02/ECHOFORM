<svg viewBox="0 0 460 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="slotbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0affff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#0affff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#0affff" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="socket" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#7ffcff" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#12d6f0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0affff" stop-opacity="0"/>
    </radialGradient>
    <filter id="gg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- ambient socket glow -->
  <ellipse cx="230" cy="330" rx="180" ry="250" fill="url(#socket)"/>

  <!-- recessed slot housing -->
  <rect x="70" y="70" width="320" height="520" rx="12" fill="url(#slotbg)" stroke="#0affff" stroke-opacity="0.35" stroke-width="2" filter="url(#gg)"/>
  <rect x="90" y="90" width="280" height="480" rx="8" fill="none" stroke="#1a7f8c" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="10 8"/>

  <!-- heavy corner guide brackets (where chip locks in) -->
  <g stroke="#7ffcff" stroke-width="5" fill="none" filter="url(#gg)">
    <path d="M70 130 L70 80 Q70 70 80 70 L130 70"/>
    <path d="M330 70 L380 70 Q390 70 390 80 L390 130"/>
    <path d="M390 530 L390 580 Q390 590 380 590 L330 590"/>
    <path d="M130 590 L80 590 Q70 590 70 580 L70 530"/>
  </g>

  <!-- alignment ticks -->
  <g stroke="#0affff" stroke-opacity="0.6" stroke-width="3" filter="url(#gg)">
    <line x1="230" y1="70" x2="230" y2="92"/>
    <line x1="230" y1="568" x2="230" y2="590"/>
    <line x1="70" y1="330" x2="92" y2="330"/>
    <line x1="368" y1="330" x2="390" y2="330"/>
  </g>

  <!-- connector rail at bottom (gold pins mate here) -->
  <g>
    <rect x="120" y="600" width="220" height="34" rx="4" fill="#0a0b0d" stroke="#23282c" stroke-width="2"/>
    <g fill="#d6ad55" opacity="0.55">
      <rect x="132" y="606" width="14" height="22"/><rect x="156" y="606" width="14" height="22"/><rect x="180" y="606" width="14" height="22"/><rect x="204" y="606" width="14" height="22"/><rect x="228" y="606" width="14" height="22"/><rect x="252" y="606" width="14" height="22"/><rect x="276" y="606" width="14" height="22"/><rect x="300" y="606" width="14" height="22"/><rect x="316" y="606" width="14" height="22"/>
    </g>
  </g>

  <!-- top status strip (progress bar zone; leave hollow for UI fill) -->
  <rect x="90" y="30" width="280" height="22" rx="4" fill="#07171b" stroke="#0affff" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- outer bloom ring -->
  <rect x="70" y="70" width="320" height="520" rx="12" fill="none" stroke="#0affff" stroke-width="3" opacity="0.4" filter="url(#soft)"/>
</svg>
