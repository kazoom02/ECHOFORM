<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2e34"/><stop offset="0.5" stop-color="#14171b"/><stop offset="1" stop-color="#1b1f24"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c525a"/><stop offset="1" stop-color="#20242a"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- frame ring (outer chamfered shape minus inner hole) : border = 48px -->
  <path fill-rule="evenodd" fill="url(#body)" stroke="url(#bevel)" stroke-width="3"
        d="M32 8 L224 8 L248 32 L248 224 L224 248 L32 248 L8 224 L8 32 Z
           M48 48 L48 208 L208 208 L208 48 Z"/>

  <!-- inner cyan rail (edges stretch cleanly) -->
  <rect x="48" y="48" width="160" height="160" fill="none" stroke="#0affff" stroke-opacity="0.55" stroke-width="2" filter="url(#g)"/>
  <!-- outer top trim -->
  <path d="M40 18 L216 18" stroke="#0affff" stroke-width="2" stroke-opacity="0.6" filter="url(#g)"/>

  <!-- corner brackets (live inside the 48px corner regions) -->
  <g stroke="#5efcff" stroke-width="3" fill="none" opacity="0.9" filter="url(#g)">
    <path d="M60 74 L60 60 L74 60"/>
    <path d="M182 60 L196 60 L196 74"/>
    <path d="M196 182 L196 196 L182 196"/>
    <path d="M74 196 L60 196 L60 182"/>
  </g>
  <!-- corner bolts -->
  <g fill="#0a0c0e" stroke="#3a4046" stroke-width="1.2">
    <path d="M24 24 l7 0 l3.5 6 l-3.5 6 l-7 0 l-3.5 -6 z"/>
    <path d="M225 24 l7 0 l3.5 6 l-3.5 6 l-7 0 l-3.5 -6 z"/>
    <path d="M24 220 l7 0 l3.5 6 l-3.5 6 l-7 0 l-3.5 -6 z"/>
    <path d="M225 220 l7 0 l3.5 6 l-3.5 6 l-7 0 l-3.5 -6 z"/>
  </g>
</svg>
