<svg viewBox="0 0 640 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Titanium shell gradient -->
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2e33"/>
      <stop offset="0.35" stop-color="#15171a"/>
      <stop offset="0.65" stop-color="#0c0d0f"/>
      <stop offset="1" stop-color="#1c1f23"/>
    </linearGradient>
    <linearGradient id="shellEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5058"/>
      <stop offset="0.5" stop-color="#191b1e"/>
      <stop offset="1" stop-color="#34383d"/>
    </linearGradient>
    <!-- Graphite PCB -->
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16191d"/>
      <stop offset="0.5" stop-color="#0e1114"/>
      <stop offset="1" stop-color="#131619"/>
    </linearGradient>
    <!-- Holographic display -->
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0affff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#12c8e6" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0affff" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="holoScan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5efcff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5efcff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5efcff" stop-opacity="0"/>
    </linearGradient>
    <!-- Digital screen -->
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#041418"/>
      <stop offset="1" stop-color="#010a0c"/>
    </linearGradient>
    <!-- Gold pins -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e39b"/>
      <stop offset="0.4" stop-color="#d6ad55"/>
      <stop offset="0.7" stop-color="#b3862f"/>
      <stop offset="1" stop-color="#8a641f"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ffcff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#12d6f0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0affff" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan glow filter -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- Hex pattern -->
    <pattern id="hex" width="34" height="30" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M8.5 0 L25.5 0 L34 15 L25.5 30 L8.5 30 L0 15 Z" fill="none" stroke="#0affff" stroke-opacity="0.10" stroke-width="1"/>
      <path d="M25.5 15 L42.5 15 L51 30" fill="none" stroke="#0affff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="hexFine" width="18" height="16" patternUnits="userSpaceOnUse">
      <path d="M4.5 0 L13.5 0 L18 8 L13.5 16 L4.5 16 L0 8 Z" fill="none" stroke="#1a7f8c" stroke-opacity="0.14" stroke-width="0.6"/>
    </pattern>

    <!-- warning triangle marker (no text) -->
    <g id="warn">
      <path d="M0 -6 L7 6 L-7 6 Z" fill="none" stroke="#e0a020" stroke-width="1.4" stroke-linejoin="round"/>
      <line x1="0" y1="-1.5" x2="0" y2="2.5" stroke="#e0a020" stroke-width="1.4"/>
      <circle cx="0" cy="4.3" r="0.8" fill="#e0a020"/>
    </g>
  </defs>

  <!-- ================= OUTER SHELL ================= -->
  <!-- shell body with cut (chamfered) military corners -->
  <path d="M70 40
           L500 40 L600 140
           L600 700 L560 740
           L560 840 L500 900
           L140 900 L80 840
           L80 300 L40 260
           L40 110 Z"
        fill="url(#shell)" stroke="url(#shellEdge)" stroke-width="3"/>
  <!-- inner bevel line -->
  <path d="M70 40
           L500 40 L600 140
           L600 700 L560 740
           L560 840 L500 900
           L140 900 L80 840
           L80 300 L40 260
           L40 110 Z"
        fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="1" transform="translate(0,3)"/>

  <!-- corner hex bolt accents -->
  <g fill="#0a0c0e" stroke="#3a4046" stroke-width="1.5">
    <path d="M92 70 l10 0 l5 8.6 l-5 8.6 l-10 0 l-5 -8.6 z"/>
    <path d="M540 828 l10 0 l5 8.6 l-5 8.6 l-10 0 l-5 -8.6 z"/>
    <path d="M60 250 l9 0 l4.5 7.8 l-4.5 7.8 l-9 0 l-4.5 -7.8 z"/>
  </g>

  <!-- ================= PCB INNER PANEL ================= -->
  <rect x="108" y="96" width="424" height="612" rx="10" fill="url(#pcb)" stroke="#2b3136" stroke-width="2"/>
  <rect x="108" y="96" width="424" height="612" rx="10" fill="url(#hexFine)"/>
  <rect x="108" y="96" width="424" height="612" rx="10" fill="url(#hex)"/>
  <rect x="108" y="96" width="424" height="612" rx="10" fill="none" stroke="#0affff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- ================= CIRCUITRY TRACES ================= -->
  <g stroke="#0affff" fill="none" filter="url(#glow)">
    <g stroke-width="1.6" stroke-opacity="0.55">
      <path d="M130 150 L210 150 L230 170 L230 260"/>
      <path d="M130 200 L180 200 L200 220 L320 220"/>
      <path d="M510 170 L440 170 L420 190 L420 300"/>
      <path d="M510 240 L470 240 L450 260 L360 260"/>
      <path d="M130 560 L200 560 L220 580 L220 660"/>
      <path d="M510 540 L430 540 L410 560 L410 650"/>
      <path d="M320 660 L320 600 L340 580 L470 580"/>
      <path d="M180 470 L180 520 L160 540 L130 540"/>
    </g>
    <g stroke-width="1" stroke-opacity="0.3">
      <path d="M150 300 L150 420 L170 440 L260 440"/>
      <path d="M490 320 L490 460 L470 480 L390 480"/>
      <path d="M250 130 L250 100"/>
      <path d="M400 130 L400 100"/>
    </g>
  </g>
  <!-- trace nodes -->
  <g fill="#7ffcff" filter="url(#glow)">
    <circle cx="230" cy="150" r="3"/><circle cx="320" cy="220" r="3"/>
    <circle cx="420" cy="170" r="3"/><circle cx="360" cy="260" r="3"/>
    <circle cx="220" cy="660" r="3"/><circle cx="410" cy="650" r="3"/>
    <circle cx="130" cy="540" r="3"/><circle cx="470" cy="580" r="3"/>
    <circle cx="260" cy="440" r="2.5"/><circle cx="390" cy="480" r="2.5"/>
  </g>

  <!-- ================= HOLOGRAPHIC DISPLAY ================= -->
  <g>
    <rect x="150" y="130" width="340" height="230" rx="6" fill="url(#holo)" stroke="#0affff" stroke-opacity="0.5" stroke-width="1.5" filter="url(#glow)"/>
    <!-- holo scanlines -->
    <g stroke="#5efcff" stroke-opacity="0.14" stroke-width="1">
      <line x1="150" y1="160" x2="490" y2="160"/>
      <line x1="150" y1="185" x2="490" y2="185"/>
      <line x1="150" y1="210" x2="490" y2="210"/>
      <line x1="150" y1="235" x2="490" y2="235"/>
      <line x1="150" y1="260" x2="490" y2="260"/>
      <line x1="150" y1="285" x2="490" y2="285"/>
      <line x1="150" y1="310" x2="490" y2="310"/>
      <line x1="150" y1="335" x2="490" y2="335"/>
    </g>
    <rect x="150" y="150" width="340" height="40" fill="url(#holoScan)"/>
    <!-- corner brackets -->
    <g stroke="#7ffcff" stroke-width="2" fill="none" stroke-opacity="0.8">
      <path d="M162 148 L162 138 L172 138"/>
      <path d="M478 148 L478 138 L468 138"/>
      <path d="M162 342 L162 352 L172 352"/>
      <path d="M478 342 L478 352 L468 352"/>
    </g>
    <!-- holo hex emblem -->
    <g transform="translate(320,245)" filter="url(#glow)">
      <path d="M0 -46 L40 -23 L40 23 L0 46 L-40 23 L-40 -23 Z" fill="none" stroke="#0affff" stroke-opacity="0.6" stroke-width="1.6"/>
      <path d="M0 -30 L26 -15 L26 15 L0 30 L-26 15 L-26 -15 Z" fill="none" stroke="#5efcff" stroke-opacity="0.5" stroke-width="1.2"/>
      <path d="M0 -14 L12 -7 L12 7 L0 14 L-12 7 L-12 -7 Z" fill="#0affff" fill-opacity="0.25" stroke="#7ffcff" stroke-width="1"/>
      <circle cx="0" cy="0" r="30" fill="url(#coreGlow)"/>
    </g>
  </g>

  <!-- ================= SMALL DIGITAL SCREEN ================= -->
  <g>
    <rect x="150" y="500" width="200" height="120" rx="4" fill="url(#screen)" stroke="#2b3136" stroke-width="2"/>
    <rect x="150" y="500" width="200" height="120" rx="4" fill="none" stroke="#0affff" stroke-opacity="0.35" stroke-width="1"/>
    <!-- bar-graph readout (no text) -->
    <g fill="#0affff" filter="url(#glow)">
      <rect x="164" y="588" width="10" height="18" opacity="0.9"/>
      <rect x="180" y="574" width="10" height="32" opacity="0.85"/>
      <rect x="196" y="558" width="10" height="48" opacity="0.9"/>
      <rect x="212" y="580" width="10" height="26" opacity="0.7"/>
      <rect x="228" y="566" width="10" height="40" opacity="0.85"/>
      <rect x="244" y="592" width="10" height="14" opacity="0.6"/>
    </g>
    <!-- waveform line -->
    <polyline points="150,535 175,535 185,518 200,552 215,528 235,540 260,522 275,538 300,538 320,530 350,530"
              fill="none" stroke="#5efcff" stroke-width="1.6" filter="url(#glow)" stroke-opacity="0.85"/>
    <!-- indicator dots -->
    <g>
      <circle cx="322" cy="514" r="3.5" fill="#5eff9c" filter="url(#glow)"/>
      <circle cx="336" cy="514" r="3.5" fill="#e0a020" filter="url(#glow)"/>
    </g>
  </g>

  <!-- side data ports / screen 2 -->
  <g>
    <rect x="378" y="500" width="112" height="120" rx="4" fill="#0b0e11" stroke="#2b3136" stroke-width="2"/>
    <g stroke="#0affff" stroke-opacity="0.4" stroke-width="1">
      <line x1="392" y1="520" x2="476" y2="520"/>
      <line x1="392" y1="540" x2="476" y2="540"/>
      <line x1="392" y1="560" x2="450" y2="560"/>
      <line x1="392" y1="580" x2="468" y2="580"/>
      <line x1="392" y1="600" x2="440" y2="600"/>
    </g>
    <circle cx="466" cy="560" r="4" fill="#0affff" filter="url(#glow)"/>
    <circle cx="458" cy="600" r="4" fill="#5eff9c" filter="url(#glow)"/>
  </g>

  <!-- ================= HEX MICRO-COMPONENTS ================= -->
  <g fill="#0a0d0f" stroke="#2f363b" stroke-width="1.5">
    <path d="M150 400 l22 0 l11 19 l-11 19 l-22 0 l-11 -19 z"/>
    <path d="M250 400 l22 0 l11 19 l-11 19 l-22 0 l-11 -19 z"/>
    <path d="M400 400 l22 0 l11 19 l-11 19 l-22 0 l-11 -19 z"/>
  </g>
  <g fill="#0affff" filter="url(#glow)" opacity="0.9">
    <circle cx="161" cy="419" r="3"/><circle cx="261" cy="419" r="3"/><circle cx="411" cy="419" r="3"/>
  </g>

  <!-- ================= WARNING MARKERS (no text) ================= -->
  <use href="#warn" x="132" y="128"/>
  <use href="#warn" x="508" y="490"/>
  <use href="#warn" x="360" y="672"/>
  <!-- hazard stripe block -->
  <g>
    <clipPath id="haz"><rect x="360" y="662" width="120" height="14" rx="2"/></clipPath>
    <rect x="360" y="662" width="120" height="14" rx="2" fill="#161311"/>
    <g clip-path="url(#haz)" stroke="#e0a020" stroke-width="6" stroke-opacity="0.55">
      <line x1="356" y1="678" x2="372" y2="656"/>
      <line x1="372" y1="678" x2="388" y2="656"/>
      <line x1="388" y1="678" x2="404" y2="656"/>
      <line x1="404" y1="678" x2="420" y2="656"/>
      <line x1="420" y1="678" x2="436" y2="656"/>
      <line x1="436" y1="678" x2="452" y2="656"/>
      <line x1="452" y1="678" x2="468" y2="656"/>
      <line x1="468" y1="678" x2="484" y2="656"/>
    </g>
  </g>

  <!-- ================= GOLD CONNECTOR PINS ================= -->
  <g>
    <rect x="150" y="726" width="340" height="150" rx="4" fill="#0a0b0d" stroke="#23282c" stroke-width="2"/>
    <!-- pin contacts -->
    <g fill="url(#gold)" stroke="#6a4c16" stroke-width="1">
      <rect x="164" y="740" width="26" height="120" rx="2"/>
      <rect x="198" y="740" width="26" height="120" rx="2"/>
      <rect x="232" y="740" width="26" height="120" rx="2"/>
      <rect x="266" y="740" width="26" height="120" rx="2"/>
      <rect x="300" y="740" width="26" height="120" rx="2"/>
      <rect x="334" y="740" width="26" height="120" rx="2"/>
      <rect x="368" y="740" width="26" height="120" rx="2"/>
      <rect x="402" y="740" width="26" height="120" rx="2"/>
      <rect x="436" y="740" width="26" height="120" rx="2"/>
    </g>
    <!-- pin highlight edges -->
    <g stroke="#fbeaa8" stroke-width="1.2" stroke-opacity="0.7">
      <line x1="167" y1="742" x2="167" y2="858"/>
      <line x1="201" y1="742" x2="201" y2="858"/>
      <line x1="235" y1="742" x2="235" y2="858"/>
      <line x1="269" y1="742" x2="269" y2="858"/>
      <line x1="303" y1="742" x2="303" y2="858"/>
      <line x1="337" y1="742" x2="337" y2="858"/>
      <line x1="371" y1="742" x2="371" y2="858"/>
      <line x1="405" y1="742" x2="405" y2="858"/>
      <line x1="439" y1="742" x2="439" y2="858"/>
    </g>
    <!-- contact seam -->
    <line x1="150" y1="770" x2="490" y2="770" stroke="#000" stroke-opacity="0.5" stroke-width="1"/>
  </g>

  <!-- ================= TOP EDGE DETAIL / NOTCH ================= -->
  <rect x="260" y="34" width="120" height="12" rx="3" fill="#0a0c0e" stroke="#3a4046" stroke-width="1"/>
  <g fill="#0affff" filter="url(#glow)">
    <circle cx="290" cy="40" r="2.2"/><circle cx="320" cy="40" r="2.2"/><circle cx="350" cy="40" r="2.2"/>
  </g>

  <!-- outer ambient glow accents -->
  <g opacity="0.5" filter="url(#softGlow)">
    <rect x="150" y="130" width="340" height="230" rx="6" fill="none" stroke="#0affff" stroke-width="2"/>
  </g>
</svg>
